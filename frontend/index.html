<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b20">
  <title>Terrifront</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Jersey+15&family=New+Rocker&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../Assets/logo_two.png">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="home-screen">
    <div class="logo-wash" aria-hidden="true"></div>
    <div class="logo-tint" aria-hidden="true"></div>

    <section class="hero" aria-labelledby="game-title">
      <p class="home-kicker">TACTICAL MAP // LIVE FRONT</p>
      <div class="title-lockup">
        <img class="title-logo" src="../Assets/logo_two.png" alt="">
        <h1 id="game-title">TERRI<span>FRONT</span></h1>
        <img class="title-logo" src="../Assets/logo_two.png" alt="">
      </div>
      <div class="beta-badge" role="note">THIS GAME IS IN BETA TESTING</div>

      <form class="launch-panel" id="launch-form">
        <div class="name-row">
          <label class="sr-only" for="player-name">Player name</label>
          <input id="player-name" name="playerName" type="text" maxlength="24" autocomplete="nickname" spellcheck="false" required>
        </div>
        <button class="play-button" type="submit">
          <span>PLAY</span>
        </button>
        <p class="launch-status" id="launch-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <main class="lobby-screen" id="lobby-screen" hidden>
    <div class="map-wash" aria-hidden="true"></div>
    <div class="map-glow" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <button class="lobby-back-button" id="lobby-back-button" type="button">GO BACK</button>
    <section class="lobby-panel" aria-labelledby="lobby-title">
      <h2 id="lobby-title">JOIN THE FRONT</h2>
      <p class="lobby-id" id="lobby-id">LOBBY --</p>
      <div class="lobby-countdown" id="lobby-countdown">00:30</div>
      <div class="lobby-meter"><span id="lobby-meter-fill"></span></div>
      <div class="lobby-stats">
        <span>PLAYERS <strong id="lobby-player-count">0 / 250</strong></span>
        <span>STATUS <strong id="lobby-status">OPEN</strong></span>
      </div>
      <div class="lobby-roster" id="lobby-roster" aria-live="polite"></div>
      <button class="lobby-join-button" id="lobby-join-button" type="button">JOIN LOBBY</button>
      <button class="lobby-leave-button" id="lobby-leave-button" type="button">LEAVE LOBBY</button>
    </section>
  </main>

  <main class="game-screen" id="game-screen" hidden>
    <button class="quit-button" id="quit-button" type="button">QUIT</button>
    <div class="map-menu" id="map-menu" role="menu" hidden>
      <button type="button" class="map-menu-item" data-action="attack" role="menuitem" aria-label="Attack" title="Attack">
        <img src="../Assets/attack_logo.png" alt="">
      </button>
      <button type="button" class="map-menu-item" data-action="boat" role="menuitem" aria-label="Boat" title="Boat">
        <img src="../Assets/boat_logo.png" alt="">
      </button>
    </div>
    <div class="winner-banner" id="winner-banner" hidden role="status" aria-live="polite">WINNER</div>
    <div class="active-attacks" id="active-attacks" aria-live="polite"></div>
    <div class="selector-stats" id="selector-stats" hidden>
      <div class="selector-troops">
        <span class="selector-troops-icon">⚔</span>
        <span id="selector-troop-count">0</span>
      </div>
      <div class="selector-meta">
        <span>▦ <b id="selector-territory">0</b></span>
        <span>⬡ <b id="selector-density">0.00</b></span>
      </div>
    </div>
    <div class="attack-ratio-panel" id="attack-ratio-panel" hidden>
      <button class="ratio-btn ratio-btn-minus" id="ratio-minus" aria-label="Decrease">-</button>
      <div class="ratio-bar-track" id="ratio-track">
        <div class="ratio-bar-fill" id="ratio-bar-fill"></div>
        <span class="ratio-bar-label" id="ratio-bar-label">0 troops (50%)</span>
      </div>
      <button class="ratio-btn ratio-btn-plus" id="ratio-plus" aria-label="Increase">+</button>
      <input id="power-slider" class="power-slider-hidden" type="range" min="1" max="100" value="50" step="1" aria-label="Attack ratio">
    </div>
    <div class="leaderboard" id="leaderboard" hidden aria-label="Player leaderboard"></div>
    <div class="spawn-hud" id="spawn-hud" hidden>
      <div class="spawn-hud-label"><span>SPAWN PHASE</span><strong id="spawn-time">30</strong></div>
      <div class="spawn-progress"><span id="spawn-progress-bar"></span></div>
      <p id="spawn-message">CHOOSE A LAND POSITION FOR YOUR CAPITAL</p>
    </div>
    <div class="map-frame">
      <canvas id="game-canvas" aria-label="Terrifront game map"></canvas>
      <canvas id="dynamic-canvas" aria-hidden="true"></canvas>
    </div>
  </main>

  <script src="../shared/binary-protocol.js"></script>
  <script src="communicator.js"></script>
  <script src="player-label-renderer.js"></script>
  <script src="game-ui/map-geometry.js"></script>
  <script src="game-ui/color-utils.js"></script>
  <script src="game-ui/game-store.js"></script>
  <script src="gameUI.js"></script>
  <script src="index.js"></script>
</body>
</html>
